
name: CI Pipeline

on:
  push:
    branches: [ develop, main, feature/mongodb-integration ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check frontend configuration
        id: frontend-check
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.frontend-check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.frontend-check.outputs.ready == 'true'
        run: |
          cd frontend
          npm ci

      - name: Lint
        if: steps.frontend-check.outputs.ready == 'true'
        run: |
          cd frontend
          npm run lint

      - name: Skip frontend checks
        if: steps.frontend-check.outputs.ready == 'false'
        run: echo "Frontend configuration is missing. Frontend checks skipped."
